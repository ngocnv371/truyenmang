info:
  name: get single chapter
  type: http
  seq: 1

http:
  method: GET
  url: '{{api_base}}/api/chapters/?filters[slug][$eq]=chapter-1-what-s-that-egg&populate[book]=true'
  params:
    - name: filters[slug][$eq]
      value: chapter-1-what-s-that-egg
      type: query
    - name: populate[book]
      value: 'true'
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
